[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-developer-portal"
version = "0.1.0"
description = "MCP Platform developer portal — API key management, usage dashboard, and Stripe billing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "stripe>=8.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    "slowapi>=0.1.9",
    "mangum>=0.17.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gateway = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "moto[dynamodb]>=4.2.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "gateway"]
